name: EBAC CI mobile Test

on:
  push:
    branches: [ci]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: browserstack
      PLATFORM: android
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Install Dependencies
        run: npm i

      - name: Enviar o app para o BrowserStack
        run: |
          RESPONSE=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app/ebacshop.aab")

          echo "$RESPONSE"

          APP_URL=$(echo "$RESPONSE" | jq -r '.app_url')

          if [ -z "$APP_URL" ] || [ "$APP_URL" = "null" ]; then
            echo "::error::Não recebi um app_url do BrowserStack. Confira os secrets BROWSERSTACK_USERNAME e BROWSERSTACK_ACCESS_KEY."
            exit 1
          fi

          echo "App enviado: $APP_URL"
          echo "BROWSERSTACK_APP_URL=$APP_URL" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Publish Report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
